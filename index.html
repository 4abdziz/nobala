.next .lbl{font-size:13px;opacity:.75}.next .nm{font-size:22px;font-weight:700}.next .dt{text-align:left;font-size:14px;opacity:.9}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted);margin:6px 2px 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap}.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid}
table{width:100%;border-collapse:separate;border-spacing:0 6px}
th{font-weight:700;font-size:13px;color:var(--muted);text-align:right;padding:4px 12px}
td{padding:11px 12px;vertical-align:middle;border-top:1px solid;border-bottom:1px solid}
td:first-child{border-right:4px solid;border-radius:0 12px 12px 0;width:44px;text-align:center;font-weight:700}
td:last-child{border-left:1px solid;border-radius:12px 0 0 12px}
tr.done td{background:var(--done-bg);border-color:var(--done-bd);color:var(--done-ink)}
tr.cur td{background:var(--cur-bg);border-color:var(--cur-bd);color:var(--cur-ink)}
tr.cur td:first-child{border-right-width:6px}
tr.up td{background:var(--up-bg);border-color:var(--up-bd);color:var(--up-ink)}
tr.block td{background:repeating-linear-gradient(-45deg,#efebe5,#efebe5 8px,#e7e2da 8px,#e7e2da 16px);border-color:#d8d1c6;color:#8a7f73;font-size:14px}
.name{font-weight:700;font-size:17px}
.tag{font-size:11px;font-weight:500;padding:1px 8px;border-radius:20px;background:rgba(0,0,0,.06);display:inline-block;margin:0 16px 0 0;white-space:nowrap;vertical-align:middle}
.struck{text-decoration:line-through;opacity:.6}
.h{font-weight:700;white-space:nowrap}.g{font-size:12px;opacity:.75;white-space:nowrap}
.subn{font-weight:700}.empty{opacity:.35}
.skip{font-weight:500;font-style:normal}
select,input[type=text],input[type=password]{font-family:var(--font);font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);max-width:100%}
button{font-family:var(--font);font-weight:500;font-size:14px;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--coffee);padding:7px 14px}
button.pri{background:var(--coffee);color:#fff;border-color:var(--coffee)}
button.danger{color:#b3261e;border-color:#efc4c0}
button.mini{padding:3px 10px;font-size:13px}
.ins td{padding:0;border:none!important;background:none!important}
.ins button{width:100%;border:1px dashed #cdbfa9;background:transparent;color:var(--muted);font-size:12px;padding:2px}
.ins button:hover{background:#fff8ee;color:var(--coffee)}
.acts{display:flex;gap:6px;justify-content:flex-end}
footer{margin-top:22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.ov{position:fixed;inset:0;background:rgba(40,28,20,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 12px;font-weight:700;color:var(--coffee)}
.dlg .row{margin:10px 0}.dlg label{display:flex;align-items:center;gap:8px;cursor:pointer}
.dlg .btns{display:flex;gap:8px;justify-content:flex-start;margin-top:16px;flex-wrap:wrap}
.err{color:#b3261e;font-size:13px;min-height:18px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:12px;font-size:14px;z-index:20}
.toast.bad{background:#b3261e}
@media (max-width:560px){.wrap{padding:18px 8px 50px}.h{font-size:13px}.subn{font-size:14px}select{font-size:13px;padding:5px 4px;max-width:110px}td{padding:9px 6px}th{padding:4px 7px}.name{font-size:15px}td:first-child{width:30px}.acts{flex-direction:column}}
</style></head><body><div id="app"></div><script id="main">
(function(){
var PASS='1448';
var ST=null,SHA=null;
var ART=null, ADMIN=false;
try{var rs=+sessionStorage.getItem('dhf_resume')||0;ADMIN=Date.now()-rs<120000;sessionStorage.removeItem('dhf_resume');sessionStorage.removeItem('dhf_admin');}catch(e){}
var GH=(function(){var m=location.hostname.match(/^([^.]+)\.github\.io$/i);if(!m)return null;var seg=location.pathname.split('/').filter(Boolean)[0];return {o:m[1],r:(seg&&!/\.html?$/i.test(seg))?seg:m[1]+'.github.io'};})();
var API=GH?'https://api.github.com/repos/'+GH.o+'/'+GH.r+'/contents/data.json':null;
function b64dec(c){return decodeURIComponent(escape(atob(c.replace(/\s/g,''))));}
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function getTok(){try{return localStorage.getItem('dhf_gh_token')||'';}catch(e){return '';}}
function setTok(v){try{if(v)localStorage.setItem('dhf_gh_token',v);else localStorage.removeItem('dhf_gh_token');}catch(e){}}
function loadData(){
  function local(){return fetch('data.json?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();});}
  if(!API)return local();
  var h={Accept:'application/vnd.github+json'},tk=getTok();if(tk)h.Authorization='Bearer '+tk;
  return fetch(API+'?t='+Date.now(),{headers:h,cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){SHA=j.sha;return JSON.parse(b64dec(j.content));}).catch(local);}

var fH=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{timeZone:'UTC',day:'numeric',month:'numeric',year:'numeric'});
var fG=new Intl.DateTimeFormat('ar-EG-u-ca-gregory-nu-latn',{timeZone:'UTC',day:'numeric',month:'long',year:'numeric'});
var TODAY=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function D(iso){return new Date(iso+'T00:00:00Z');}
function addD(iso,n){return new Date(D(iso).getTime()+n*864e5).toISOString().slice(0,10);}
function hij(iso){var o={};fH.formatToParts(D(iso)).forEach(function(p){if(p.type!=='literal')o[p.type]=parseInt(p.value,10);});return o;}
function hStr(iso){var h=hij(iso);return h.year+'/'+h.month+'/'+h.day+' هـ';}
function gStr(iso){return fG.format(D(iso))+' م';}
function blockReason(iso){var h=hij(iso);
  if(h.month===9&&h.day>=21)return 'العشر الأواخر من رمضان';
  if(h.month===10&&h.day<=4)return 'عيد الفطر';
  if(h.month===12&&h.day>=9&&h.day<=13)return 'عيد الأضحى';
  return null;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nid(){ST.seq=(ST.seq||0)+1;return 's'+ST.seq;}

function layout(){var rows=[],d=ST.start,n=0;
  ST.slots.forEach(function(s,i){var g=0,r;while((r=blockReason(d))&&g++<60){rows.push({kind:'block',date:d,reason:r});d=addD(d,7);}
    rows.push({kind:'slot',slot:s,idx:i,date:d,no:++n});d=addD(d,7);});
  return rows;}
function slotRows(){return layout().filter(function(r){return r.kind==='slot';});}
function roll(){var guard=0;while(guard++<30){var rs=slotRows();if(!rs.length||!ST.base.length)break;var last=rs[rs.length-1].date;if(last>=TODAY)break;
  ST.start=addD(last,7);ST.slots=ST.base.map(function(n){return {id:nid(),type:'p',name:n};});ST.subs={};ST.cycleNo=(ST.cycleNo||1)+1;}}

function clearSub(id){var s=ST.subs[id];if(!s)return;delete ST.subs[id];if(s.pair&&ST.subs[s.pair]&&ST.subs[s.pair].pair===id)delete ST.subs[s.pair];}
function pairOf(id){var c=ST.subs[id];return c&&c.pair&&ST.subs[c.pair]&&ST.subs[c.pair].pair===id?c.pair:null;}
function setSub(id,name,mode){var slot=ST.slots.filter(function(x){return x.id===id;})[0],cur=ST.subs[id],p=pairOf(id),duty=slot.name;
  if(p){if(mode==='pass'){delete ST.subs[p].pair;duty=cur.name;}else delete ST.subs[p];}
  delete ST.subs[id];if(!name)return;
  ST.subs[id]={name:name};if(name===duty)return;
  var t=slotRows().filter(function(r){return r.slot.id!==id&&r.slot.type==='p'&&r.slot.name===name&&!ST.subs[r.slot.id];})[0];
  if(t&&t.slot.name!==duty){ST.subs[id].pair=t.slot.id;ST.subs[t.slot.id]={name:duty,pair:id};}}
function allNames(){var s=[];ST.base.forEach(function(n){if(s.indexOf(n)<0)s.push(n);});ST.slots.forEach(function(x){if(x.type==='p'&&s.indexOf(x.name)<0)s.push(x.name);});return s;}

function render(){
  var rows=layout(),srows=rows.filter(function(r){return r.kind==='slot';});
  var curId=null;for(var i=0;i<srows.length;i++){if(srows[i].date>=TODAY){curId=srows[i].slot.id;break;}}
  var firstOpen=srows.length;srows.forEach(function(r){if(r.date>=TODAY&&r.idx<firstOpen)firstOpen=r.idx;});
  var cur=srows.filter(function(r){return r.slot.id===curId;})[0];
  var h='<div class="wrap"><header><div class="logo" role="img" aria-label="شعار مجموعة النبلاء"></div><h1>جدول الضيافة</h1><div class="sub">لطلعة الأربعاء <b>(النبلاء)</b></div><div class="orn"></div></header>';
  if(cur){var who=cur.slot.type==='p'?(ST.subs[cur.slot.id]?ST.subs[cur.slot.id].name+' <span style="font-size:13px;opacity:.75">(بدلاً عن '+esc(cur.slot.name)+')</span>':esc(cur.slot.name)):esc(cur.slot.note||'لا توجد طلعة');
    if(ST.subs[cur.slot.id])who=esc(ST.subs[cur.slot.id].name)+' <span style="font-size:13px;opacity:.75">(بدلاً عن '+esc(cur.slot.name)+')</span>';
    h+='<div class="next"><div><div class="lbl">'+(cur.date===TODAY?'ضيافة اليوم':'الضيافة القادمة')+'</div><div class="nm">'+who+'</div></div><div class="dt">الأربعاء '+hStr(cur.date)+'<br>'+gStr(cur.date)+'</div></div>';}
  if(srows.length)h+='<div class="meta"><span>الدورة الحالية: من '+hStr(srows[0].date)+' إلى '+hStr(srows[srows.length-1].date)+'</span>'+
    '<span class="legend"><span><i style="background:var(--done-bg);border-color:var(--done-bd)"></i>تمّت</span><span><i style="background:var(--cur-bg);border-color:var(--cur-bd)"></i>الحالية</span><span><i style="background:var(--up-bg);border-color:var(--up-bd)"></i>قادمة</span></span></div>';
  h+='<table><thead><tr><th>#</th><th>الاسم</th><th>التاريخ</th><th>البديل</th>'+(ADMIN?'<th></th>':'')+'</tr></thead><tbody>';
  var cols=ADMIN?5:4;
  function insRow(i){return ADMIN?'<tr class="ins"><td colspan="'+cols+'"><button data-ins="'+i+'">＋ إضافة أسبوع هنا</button></td></tr>':'';}
  rows.forEach(function(r){
    if(r.kind==='block'){h+='<tr class="block"><td>—</td><td colspan="'+(cols-1)+'"><b>لا ضيافة</b> · '+esc(r.reason)+' · الأربعاء '+hStr(r.date)+' <span class="g">('+gStr(r.date)+')</span></td></tr>';return;}
    h+=insRow(r.idx);
    var s=r.slot,st=r.date<TODAY?'done':(s.id===curId?'cur':'up'),sub=ST.subs[s.id];
    var nm=s.type==='skip'?'<span class="skip">'+esc(s.note||'لا توجد طلعة')+'</span>':'<span class="name'+(sub?' struck':'')+'">'+esc(s.name)+'</span>'+(s.extra?'<span class="tag">استثنائية</span>':'');
    var subc;
    if(s.type!=='p')subc='<span class="empty">—</span>';
    else if(ADMIN){subc='<select data-sub="'+s.id+'"><option value="">—</option>'+allNames().filter(function(n){return n!==s.name;}).map(function(n){return '<option'+(sub&&sub.name===n?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>';}
    else subc=sub?'<span class="subn">'+esc(sub.name)+'</span>':'<span class="empty">—</span>';
    h+='<tr class="'+st+'"><td>'+r.no+'</td><td>'+nm+'</td><td><div class="h"><bdi>'+hStr(r.date)+'</bdi></div><div class="g">'+gStr(r.date)+'</div></td><td>'+subc+'</td>'+
      (ADMIN?'<td><div class="acts">'+(s.type==='p'?'<button class="mini" data-ren="'+s.id+'">تعديل الاسم</button>':'<button class="mini" data-ren="'+s.id+'">تعديل النص</button>')+'<button class="mini danger" data-del="'+s.id+'">حذف</button>'+'</div></td>':'')+'</tr>';});
  h+=insRow(ST.slots.length);
  h+='</tbody></table><footer>'+(ADMIN?'<button class="pri" data-act="logout">إنهاء التعديل</button><button data-act="tok">رمز GitHub</button>':'<button data-act="login">✎ تعديل الجدول</button>')+'</footer>';
  h+='<div class="note">لا ضيافة في العشر الأواخر من رمضان، ولا من ليلة العيد إلى رابع أيام عيدي الفطر والأضحى · عند انتهاء الدورة يبدأ جدول جديد تلقائياً بالترتيب الأساسي</div></div>';
  document.getElementById('app').innerHTML=h;
}

function dialog(html,mount){var ov=document.createElement('div');ov.className='ov';ov.innerHTML='<div class="dlg">'+html+'</div>';document.body.appendChild(ov);
  ov.addEventListener('click',function(e){if(e.target===ov||e.target.hasAttribute('data-close'))ov.remove();});mount(ov.querySelector('.dlg'),function(){ov.remove();});}
var tt;function toast(m,bad){var t=document.querySelector('.toast');if(!t){t=document.createElement('div');document.body.appendChild(t);}t.className='toast'+(bad?' bad':'');t.textContent=m;clearTimeout(tt);tt=setTimeout(function(){t.remove();},bad?5000:2500);}

function tokDlg(after){dialog('<h3>ربط الحفظ بـ GitHub</h3><p style="margin:0 0 8px;font-size:14px;color:var(--muted)">مرة واحدة على هذا الجهاز: الصق رمز الوصول (Token) الخاص بالمستودع.</p><div class="row"><input type="password" style="width:100%" placeholder="github_pat_..." dir="ltr"></div><div class="err"></div><div class="btns"><button class="pri" data-ok>حفظ</button><button data-close>إلغاء</button></div>',function(d,close){
  var inp=d.querySelector('input');inp.focus();d.querySelector('[data-ok]').onclick=function(){var v=inp.value.trim();if(!v){d.querySelector('.err').textContent='الصق الرمز';return;}setTok(v);close();after();};});}
var saving=false,again=false;
function save(){render();
  if(!API){toast('الحفظ يعمل بعد رفع الصفحة على GitHub Pages',true);return;}
  var tk=getTok();if(!tk){tokDlg(save);return;}
  if(saving){again=true;return;}saving=true;toast('جارٍ الحفظ…');
  var h={Accept:'application/vnd.github+json',Authorization:'Bearer '+tk};
  fetch(API+'?t='+Date.now(),{headers:h,cache:'no-store'}).then(function(r){if(r.status===401||r.status===403)throw 'auth';if(!r.ok)throw 'net'+r.status;return r.json();}).then(function(j){
    if(SHA&&j.sha!==SHA)throw 'conflict';
    return fetch(API,{method:'PUT',headers:h,body:JSON.stringify({message:'تحديث جدول الضيافة',content:b64enc(JSON.stringify(ST,null,1)),sha:j.sha})});
  }).then(function(r){if(r.status===401||r.status===403)throw 'auth';if(!r.ok)throw 'net'+r.status;return r.json();}).then(function(j){SHA=j.content.sha;saving=false;toast('تم الحفظ');if(again){again=false;save();}})
  .catch(function(e){saving=false;again=false;
    if(e==='auth'){setTok('');toast('رمز GitHub غير صالح أو بلا صلاحية — أدخله من جديد',true);}
    else if(e==='conflict'){toast('عدّل أحدٌ الجدول من جهاز آخر — تم تحميل آخر نسخة، أعد تعديلك',true);loadData().then(function(s){ST=s;roll();render();});}
    else toast('تعذّر الحفظ ('+e+')',true);});}

function loginDlg(){dialog('<h3>دخول المشرف</h3><div class="row"><input type="password" inputmode="numeric" maxlength="8" placeholder="الرمز" style="width:100%"></div><div class="err"></div><div class="btns"><button class="pri" data-ok>دخول</button><button data-close>إلغاء</button></div>',function(d,close){
  var inp=d.querySelector('input');inp.focus();function go(){if(inp.value===PASS){ADMIN=true;close();render();}else d.querySelector('.err').textContent='الرمز غير صحيح';}
  d.querySelector('[data-ok]').onclick=go;inp.onkeydown=function(e){if(e.key==='Enter')go();};});}

function delDlg(id){var s=ST.slots.filter(function(x){return x.id===id;})[0];if(!s)return;
  var perm=s.type==='p'&&!s.extra&&ST.base.indexOf(s.name)>=0;
  dialog('<h3>حذف '+esc(s.type==='p'?s.name:(s.note||'الأسبوع'))+'</h3><p style="margin:0;color:var(--muted);font-size:14px">يتقدّم من بعده مكانه وتتعدّل التواريخ التالية.</p><div class="btns"><button class="danger" data-once>حذف من هذه الدورة</button>'+(perm?'<button class="danger" data-perm>حذف نهائي</button>':'')+'<button data-close>إلغاء</button></div>',function(d,close){
    function rm(p){clearSub(id);ST.slots=ST.slots.filter(function(x){return x.id!==id;});if(p)ST.base=ST.base.filter(function(n){return n!==s.name;});close();save();}
    d.querySelector('[data-once]').onclick=function(){rm(false);};if(perm)d.querySelector('[data-perm]').onclick=function(){rm(true);};});}

function renDlg(id){var s=ST.slots.filter(function(x){return x.id===id;})[0];if(!s)return;var old=s.type==='p'?s.name:(s.note||'لا توجد طلعة');
  dialog('<h3>'+(s.type==='p'?'تعديل الاسم':'تعديل النص')+'</h3><div class="row"><input type="text" style="width:100%" value="'+esc(old)+'"></div>'+(s.type==='p'?'<p style="margin:0;font-size:13px;color:var(--muted)">يتغيّر الاسم في كل الجدول وفي الدورات القادمة.</p>':'')+'<div class="err"></div><div class="btns"><button class="pri" data-ok>حفظ</button><button data-close>إلغاء</button></div>',function(d,close){
    var inp=d.querySelector('input');inp.focus();inp.select();
    function go(){var v=inp.value.trim();if(!v){d.querySelector('.err').textContent='اكتب الاسم';return;}if(v===old){close();return;}
      if(s.type!=='p'){s.note=v;close();save();return;}
      if(allNames().indexOf(v)>=0){d.querySelector('.err').textContent='هذا الاسم موجود في الجدول';return;}
      ST.base=ST.base.map(function(n){return n===old?v:n;});ST.slots.forEach(function(x){if(x.type==='p'&&x.name===old)x.name=v;});
      Object.keys(ST.subs).forEach(function(k){if(ST.subs[k].name===old)ST.subs[k].name=v;});close();save();}
    d.querySelector('[data-ok]').onclick=go;inp.onkeydown=function(e){if(e.key==='Enter')go();};});}
function insDlg(i){var names=allNames();
  dialog('<h3>إضافة أسبوع</h3><div class="row"><label><input type="radio" name="k" value="p" checked> اسم مستضيف</label><label><input type="radio" name="k" value="skip"> لا توجد طلعة / أسبوع فارغ</label></div>'+
    '<div class="row" data-p><select style="width:100%">'+names.map(function(n){return '<option>'+esc(n)+'</option>';}).join('')+'<option value="__new">اسم جديد…</option></select>'+
    '<input type="text" data-new placeholder="الاسم الجديد" style="width:100%;margin-top:8px;display:none"><label style="margin-top:8px;display:none" data-permw><input type="checkbox" data-perm checked> إضافة دائمة للترتيب الأساسي (في الدورات القادمة)</label></div>'+
    '<div class="row" data-s style="display:none"><input type="text" data-note placeholder="ملاحظة (اختياري) مثل: سفر، إجازة" style="width:100%"></div><div class="err"></div>'+
    '<div class="btns"><button class="pri" data-ok>إضافة</button><button data-close>إلغاء</button></div>',function(d,close){
    var sel=d.querySelector('select'),nw=d.querySelector('[data-new]'),pw=d.querySelector('[data-permw]');
    function upd(){var k=d.querySelector('input[name=k]:checked').value;d.querySelector('[data-p]').style.display=k==='p'?'':'none';d.querySelector('[data-s]').style.display=k==='skip'?'':'none';
      var isNew=sel.value==='__new';nw.style.display=isNew?'':'none';pw.style.display=(isNew||ST.base.indexOf(sel.value)<0)?'':'none';}
    d.querySelectorAll('input[name=k]').forEach(function(x){x.onchange=upd;});sel.onchange=upd;upd();
    d.querySelector('[data-ok]').onclick=function(){var k=d.querySelector('input[name=k]:checked').value,slot;
      if(k==='skip'){slot={id:nid(),type:'skip',note:d.querySelector('[data-note]').value.trim()||'لا توجد طلعة'};}
      else{var name=sel.value==='__new'?nw.value.trim():sel.value;if(!name){d.querySelector('.err').textContent='اكتب الاسم';return;}
        var inBase=ST.base.indexOf(name)>=0,perm=!inBase&&pw.style.display!=='none'&&d.querySelector('[data-perm]').checked;
        slot={id:nid(),type:'p',name:name};if(!perm)slot.extra=true;
        if(perm){var pos=-1;for(var j=i-1;j>=0;j--){var x=ST.slots[j];if(x.type==='p'&&!x.extra&&ST.base.indexOf(x.name)>=0){pos=ST.base.indexOf(x.name)+1;break;}}
          if(pos<0){for(var j2=i;j2<ST.slots.length;j2++){var y=ST.slots[j2];if(y.type==='p'&&!y.extra&&ST.base.indexOf(y.name)>=0){pos=ST.base.indexOf(y.name);break;}}}
          if(pos<0)pos=ST.base.length;ST.base.splice(pos,0,name);}}
      ST.slots.splice(i,0,slot);close();save();};});}

document.addEventListener('change',function(e){var id=e.target.getAttribute&&e.target.getAttribute('data-sub');if(!id)return;var v=e.target.value,p=pairOf(id);
  if(p&&v){var slot=ST.slots.filter(function(x){return x.id===id;})[0],X=ST.subs[id].name,O=esc(slot.name),Xe=esc(X),V=esc(v);
    dialog('<h3>تعديل البديل</h3><p style="margin:0 0 8px;font-size:14px;color:var(--muted)">هذا الأسبوع أصلاً لـ'+O+'، وقد بادله '+Xe+'. ماذا تريد؟</p>'+
      '<div class="row"><label style="align-items:flex-start"><input type="radio" name="m" value="cancel" checked style="margin-top:6px"> <span>إلغاء تبادل '+O+' مع '+Xe+' (يعود '+Xe+' لأسبوعه)، ويتبادل '+O+' مع '+V+'</span></label></div>'+
      '<div class="row"><label style="align-items:flex-start"><input type="radio" name="m" value="pass" style="margin-top:6px"> <span>'+Xe+' يبادل هذا الأسبوع مع '+V+'، ويبقى '+O+' في أسبوع '+Xe+'</span></label></div>'+
      '<div class="btns"><button class="pri" data-ok>حفظ</button><button data-close>إلغاء</button></div>',function(d,close){
      d.parentNode.addEventListener('click',function(ev){if(ev.target===d.parentNode||ev.target.hasAttribute('data-close'))render();});
      d.querySelector('[data-ok]').onclick=function(){setSub(id,v,d.querySelector('input[name=m]:checked').value);close();save();};});
    return;}
  setSub(id,v,'cancel');save();});
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button');if(!b)return;
  var a=b.getAttribute('data-act');if(a==='login')return loginDlg();if(a==='tok')return tokDlg(function(){toast('تم حفظ الرمز');});if(a==='logout'){ADMIN=false;try{sessionStorage.removeItem('dhf_resume');}catch(x){}return render();}
  if(b.hasAttribute('data-ren'))return renDlg(b.getAttribute('data-ren'));if(b.hasAttribute('data-del'))return delDlg(b.getAttribute('data-del'));if(b.hasAttribute('data-ins'))return insDlg(parseInt(b.getAttribute('data-ins'),10));});
